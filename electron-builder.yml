appId: be.kuleuven.mathiasbk.marginalia-poc
productName: marginalia-poc
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Windows cannot start an .exe from inside app.asar; see cliPath() in src/main/claude/agent.ts.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
win:
  executableName: marginalia-poc
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
npmRebuild: false
