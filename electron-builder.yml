appId: io.github.maboke123.marginalia
directories:
  buildResources: build
# Only the built app; electron-builder adds the production dependencies itself.
files:
  - out/**
  - package.json
# Windows cannot start an .exe from inside app.asar; see claudeExecutable() in src/main/claude/cli.ts.
asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**
  # node-pty's native module and its conpty helpers are loaded from disk as well.
  - node_modules/node-pty/**
win:
  executableName: marginalia
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
npmRebuild: false
